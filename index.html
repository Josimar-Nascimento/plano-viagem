<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Viagem Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <!-- CONTAINER PRINCIPAL -->
    <div class="bg-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-lg border border-slate-700 my-6">
        
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold text-emerald-400">🚀 Viagem Pro</h1>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full font-mono">v2.0</span>
        </div>

        <div class="space-y-4">
            
            <!-- 1. DADOS DO VEÍCULO (Salvos no celular via localStorage) -->
            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/60 space-y-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">🚘 Dados do Veículo</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="inputConsumo" class="block text-xs text-slate-300 mb-1">Consumo (km/L)</label>
                        <input type="number" step="0.1" id="inputConsumo" placeholder="Ex: 12.5" 
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label for="inputPrecoCombustivel" class="block text-xs text-slate-300 mb-1">Preço/Litro (R$)</label>
                        <input type="number" step="0.01" id="inputPrecoCombustivel" placeholder="Ex: 5.89" 
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>
            </div>

            <!-- 2. GERENCIADOR DE MÚLTIPLOS TRECHOS (Lista Dinâmica) -->
            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/60 space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">🗺️ Trechos da Rota</h3>
                    <button type="button" onclick="adicionarTrecho()" class="text-xs bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-600 px-3 py-1 rounded-lg transition">
                        + Adicionar Trecho
                    </button>
                </div>
                
                <!-- Container onde os trechos serão inseridos via JS -->
                <div id="listaTrechos" class="space-y-2">
                    <!-- O primeiro trecho é gerado automaticamente pelo JavaScript -->
                </div>
            </div>

            <!-- 3. PEDÁGIOS, PARADAS E PASSAGEIROS -->
            <div class="grid grid-cols-3 gap-2">
                <div>
                    <label for="inputPedagios" class="block text-[11px] text-slate-300 mb-1">Pedágios (R$)</label>
                    <input type="number" step="0.01" id="inputPedagios" placeholder="0.00" value="0"
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white text-sm outline-none">
                </div>
                <div>
                    <label for="inputHorarioSaida" class="block text-[11px] text-slate-300 mb-1">Hora Saída</label>
                    <input type="time" id="inputHorarioSaida" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white text-sm outline-none">
                </div>
                <div>
                    <label for="inputPassageiros" class="block text-[11px] text-slate-300 mb-1">Passageiros</label>
                    <input type="number" id="inputPassageiros" value="1" min="1"
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white text-sm outline-none">
                </div>
            </div>

            <!-- CONTROLE DE PARADAS -->
            <div class="bg-slate-900/40 p-3 rounded-xl border border-slate-700/40 flex items-center justify-between">
                <span class="text-xs text-slate-300">Tempo Total em Paradas (min):</span>
                <input type="number" id="inputMinutosParada" placeholder="Ex: 30" value="0"
                       class="w-24 bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-sm text-center outline-none">
            </div>

            <!-- BOTÃO DE CÁLCULO -->
            <button onclick="calcularViagemPro()" 
                    class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold p-4 rounded-xl shadow-lg transition active:scale-95 text-base">
                Calcular Viagem Completa
            </button>
        </div>

        <!-- PAINEL DE RESULTADOS -->
        <div id="painelResultados" class="hidden mt-6 pt-6 border-t border-slate-700 space-y-4">
            
            <h2 class="text-lg font-bold text-center text-emerald-400">📊 Resumo do Planejamento</h2>

            <div class="grid grid-cols-2 gap-3 text-center">
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-700">
                    <span class="block text-xs text-slate-400">Horário de Chegada</span>
                    <span id="resHorarioChegada" class="text-lg font-bold text-emerald-300">--:--</span>
                    <span id="resAvisoDia" class="block text-[10px] text-amber-400"></span>
                </div>

                <div class="bg-slate-900 p-3 rounded-xl border border-slate-700">
                    <span class="block text-xs text-slate-400">Tempo Total</span>
                    <span id="resTempoTotal" class="text-lg font-bold text-white">0h 0min</span>
                </div>
            </div>

            <!-- CARD DE CUSTOS E RACHA -->
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-2">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">💰 Financeiro & Divisão</h3>
                <div class="flex justify-between text-sm">
                    <span class="text-slate-300">Combustível + Pedágios:</span>
                    <span id="resCustoTotal" class="font-bold text-white">R$ 0,00</span>
                </div>
                <div class="flex justify-between text-sm pt-2 border-t border-slate-800">
                    <span class="text-emerald-400 font-bold">Por Pessoa (Racha):</span>
                    <span id="resCustoPorPessoa" class="font-bold text-emerald-400 text-base">R$ 0,00</span>
                </div>
            </div>

        </div>

    </div>

    <!-- LÓGICA EM JAVASCRIPT EVOLUÍDA -->
    <script>
        let contadorTrechos = 0;

        // Ao carregar a página: Restaura dados do localStorage e cria o 1º trecho
        window.onload = function() {
            carregarDadosSalvos();
            adicionarTrecho(); // Inicia com pelo menos 1 trecho na tela
        };

        // 1. LÓGICA DE MÚLTIPLOS TRECHOS (Inserção de HTML Dinâmico)
        function adicionarTrecho() {
            contadorTrechos++;
            let container = document.getElementById("listaTrechos");
            
            let divTrecho = document.createElement("div");
            divTrecho.id = `trecho-${contadorTrechos}`;
            divTrecho.className = "grid grid-cols-12 gap-2 items-center bg-slate-900 p-2 rounded-lg border border-slate-800";
            
            divTrecho.innerHTML = `
                <div class="col-span-5">
                    <input type="number" placeholder="Distância (km)" class="input-distancia w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white outline-none">
                </div>
                <div class="col-span-5">
                    <input type="number" placeholder="Velocidade (km/h)" class="input-velocidade w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white outline-none">
                </div>
                <div class="col-span-2 text-center">
                    <button type="button" onclick="removerTrecho('trecho-${contadorTrechos}')" class="text-red-400 hover:text-red-300 font-bold text-sm">✕</button>
                </div>
            `;
            
            container.appendChild(divTrecho);
        }

        function removerTrecho(idElemento) {
            let elemento = document.getElementById(idElemento);
            // Garante que não apague se for o único trecho existente
            if (document.querySelectorAll("#listaTrechos > div").length > 1) {
                elemento.remove();
            } else {
                alert("A viagem deve ter pelo menos 1 trecho!");
            }
        }

        // 2. PERSISTÊNCIA COM LOCALSTORAGE (Memória do Navegador)
        function salvarDadosLocais(consumo, preco) {
            localStorage.setItem("consumoVeiculo", consumo);
            localStorage.setItem("precoCombustivel", preco);
        }

        function carregarDadosSalvos() {
            let consumoSalvo = localStorage.getItem("consumoVeiculo");
            let precoSalvo = localStorage.getItem("precoCombustivel");

            if (consumoSalvo) document.getElementById("inputConsumo").value = consumoSalvo;
            if (precoSalvo) document.getElementById("inputPrecoCombustivel").value = precoSalvo;
        }

        // 3. CÁLCULO PRINCIPAL
        function calcularViagemPro() {
            let consumo = parseFloat(document.getElementById("inputConsumo").value);
            let preco = parseFloat(document.getElementById("inputPrecoCombustivel").value);
            let pedagios = parseFloat(document.getElementById("inputPedagios").value) || 0;
            let passageiros = parseInt(document.getElementById("inputPassageiros").value) || 1;
            let minutosParada = parseInt(document.getElementById("inputMinutosParada").value) || 0;
            let horarioSaidaStr = document.getElementById("inputHorarioSaida").value;

            if (!consumo || !preco || !horarioSaidaStr) {
                alert("⚠️ Por favor, preencha o consumo, preço do combustível e o horário de saída!");
                return;
            }

            // Salva as configurações do veículo na memória do celular
            salvarDadosLocais(consumo, preco);

            // Somatório de Múltiplos Trechos usando seletores de classe
            let inputsDistancia = document.querySelectorAll(".input-distancia");
            let inputsVelocidade = document.querySelectorAll(".input-velocidade");

            let distanciaTotal = 0;
            let tempoDirecaoMinutosTotais = 0;

            for (let i = 0; i < inputsDistancia.length; i++) {
                let dist = parseFloat(inputsDistancia[i].value) || 0;
                let vel = parseFloat(inputsVelocidade[i].value) || 0;

                if (dist > 0 && vel > 0) {
                    distanciaTotal += dist;
                    tempoDirecaoMinutosTotais += (dist / vel) * 60;
                }
            }

            if (distanciaTotal === 0) {
                alert("⚠️ Adicione pelo menos um trecho válido com distância e velocidade!");
                return;
            }

            // Cálculos Financeiros
            let litrosNecessarios = distanciaTotal / consumo;
            let custoCombustivel = litrosNecessarios * preco;
            let custoTotal = custoCombustivel + pedagios;
            let custoPorPessoa = custoTotal / passageiros;

            // Tempo e Chegada
            let tempoTotalMinutos = tempoDirecaoMinutosTotais + minutosParada;
            
            let dataSaida = new Date();
            let [hSaida, mSaida] = horarioSaidaStr.split(":").map(Number);
            dataSaida.setHours(hSaida, mSaida, 0, 0);

            let dataChegada = new Date(dataSaida.getTime() + tempoTotalMinutos * 60000);

            // Formatação
            let hChegada = String(dataChegada.getHours()).padStart(2, '0');
            let mChegada = String(dataChegada.getMinutes()).padStart(2, '0');

            let difDias = dataChegada.getDate() - dataSaida.getDate();
            let avisoDia = difDias > 0 ? `(+${difDias} dia(s))` : "";

            // Injeção de Resultados
            document.getElementById("resHorarioChegada").innerText = `${hChegada}:${mChegada}`;
            document.getElementById("resAvisoDia").innerText = avisoDia;
            document.getElementById("resTempoTotal").innerText = `${Math.floor(tempoTotalMinutos/60)}h ${Math.round(tempoTotalMinutos%60)}min`;
            
            document.getElementById("resCustoTotal").innerText = custoTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById("resCustoPorPessoa").innerText = custoPorPessoa.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            document.getElementById("painelResultados").classList.remove("hidden");
        }
    </script>

</body>
</html>
